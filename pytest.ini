[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    slow: mark test as slow (deselect with '-m "not slow"')
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestDeprecationWarning
log_cli = true
log_cli_level = INFO